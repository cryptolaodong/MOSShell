id: xiaobai.app_pack
name: Xiaobai App Pack
version: 0.1.0
updated: 2026-06-26
layer: app
default_host_runtime: pollen.reachy_mini_conversation_app
mission: >
  Deliver Xiaobai's personality, learning, memory, desktop control, identity,
  and safety rules as a portable app/data pack on top of stable official or
  community host runtimes.

non_goals:
  - build_realtime_audio_stack
  - build_camera_or_video_runtime
  - build_robot_motor_runtime
  - replace_official_conversation_app_core
  - bind_child_or_identity_data_to_one_runtime

host_policy:
  preferred_1_0: pollen.reachy_mini_conversation_app
  future_candidates:
    - ghoshell.mosshell
    - ghostinshells.moss_in_reachy_mini
    - pollen.future_official_app
    - community.high_quality_runtime
  rule: thin_adapter_only

apps:
  - id: xiaobai.personality
    file: apps/personality.yaml
    status: ready_for_external_profile
  - id: xiaobai.learning.coach
    file: apps/learning.yaml
    status: contract_ready
  - id: xiaobai.memory.candidate
    file: apps/memory_candidate.yaml
    status: contract_ready
  - id: xiaobai.desktop.control
    file: apps/desktop_control.yaml
    status: contract_ready

adapters:
  - id: pollen.official_conversation_app
    file: adapters/official_reachy_mini_conversation_app.yaml

policies:
  - id: xiaobai.safety_permissions
    file: policies/safety_permissions.yaml

acceptance:
  - official_app_tests_pass
  - reachy_output_self_check_pass
  - external_profile_loads_without_core_patch
  - external_profile_name_avoids_builtin_collision
  - no_secret_or_child_private_data_in_pack
